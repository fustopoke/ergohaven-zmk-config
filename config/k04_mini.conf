# K:04 Mini — modeled on ergohaven's k03.conf (sleep + battery reporting).
#
# Power budget notes (small battery in each half; the random BLE dropouts
# we chased were voltage sag from a load that never slept, so idle
# current matters):
#   - SLEEP after 1 h without input (was 10 min, briefly 3 min — the
#     3-min timeout was felt as too eager in real desk use; idle current
#     is now low enough that a longer window costs little).
#   - The LED widget's poll thread and the IQS5xx touchpad poll should
#     be gated on the ZMK activity state — the diffs live in patches/
#     and need the forks there before they take effect; without them
#     both loops keep the CPU awake around the clock.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=7

# Onboard status LED: a single WS2812-class RGB LED, data line on P0.30,
# driven via SPIM3 and exposed as the ZMK underglow device. SPI3 is the
# only instance left (SPI0/1 are the same peripherals as the console
# UART and the touchpad's TWIM1; SPI2 refused to drive the strip at all
# on this hardware). nRF52840 anomaly 198 therefore has to be lived
# with: the widget writes one frame per colour change through the
# LED-strip API instead of letting ZMK refresh the strip at 20 Hz.
# See the comment in k04_mini.dtsi.
# ergohaven/zmk-smart-rgbled-widget indicates battery level (green/
# yellow/red), BT profile and connection state (blue/yellow/red) with
# colored blinks, on both halves.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SMART_RGBLED_WIDGET=y

# Status LED language (see smart-rgbled-widget for the full state machine):
# persistent layer colors while a non-base layer is active, charging color
# on USB (yellow, green >= 95%), BT profile color for 1s on profile switch,
# blue blink pairing / white flash reconnecting / yellow blink split
# search, green 1s on connect, red blink <= 20% battery, &ind_bat tiers.
# Status LED layer colors: the two BASE layers (0 en, 1 ru) share WHITE —
# language is deliberately NOT encoded in the LED (the layer↔OS invariant
# is enforced by the firmware, not shown). The momentary layers each get
# their OWN colour so holding any of them is visible (the complaint was
# "pressing a layer does nothing to the LED" — that happened when a
# debug tweak had flattened every layer to white). Palette:
#   1=red 2=green 3=yellow 4=blue 5=magenta 6=cyan 7=white
#   0 en = white, 1 ru = white (no language color, by user request)
#   2 nav = green, 3 sym = cyan, 4 adj = yellow, 5 pointing = magenta
# (Layer numbering after the 3/4 sym merge: adj and pointing each moved
# down by one — keep these RGBLED_WIDGET_LAYER_* indices in step with the
# keymap layer order.)
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=7
CONFIG_RGBLED_WIDGET_PERSISTENT_BRIGHTNESS=40
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=7
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y

# Official status language: BT profile switch shows the profile color for
# 1 s — BT0 red, BT1 blue, BT2 yellow, BT3 green, BT4 magenta. These are
# already the module defaults; pinned explicitly so a module bump cannot
# silently change the language.
CONFIG_RGBLED_WIDGET_PROFILE_COLOR_0=1
CONFIG_RGBLED_WIDGET_PROFILE_COLOR_1=4
CONFIG_RGBLED_WIDGET_PROFILE_COLOR_2=3
CONFIG_RGBLED_WIDGET_PROFILE_COLOR_3=2
CONFIG_RGBLED_WIDGET_PROFILE_COLOR_4=5

# Official low-battery warning: short red flash every 2 s at <= 20%
# while not on USB-C. Intervals take effect immediately; the 20%
# threshold itself is RGBLED_WIDGET_LOW_BATTERY_LEVEL (default 20),
# which arrives with patches/0001 — the pinned module flashes only at
# <= 10%.
CONFIG_RGBLED_WIDGET_LOW_BATTERY_BLINK_INTERVAL_MS=2000
CONFIG_RGBLED_WIDGET_LOW_BATTERY_CRITICAL_INTERVAL_MS=2000

# =====================================================================
# Touchpad (right half only — the DT node exists on that side).
# Azoteq IQS5xx polled over I2C; the module socket does not route RDY.
#
# CONFIG_I2C is required for the driver's Kconfig dependencies to
# resolve; without it INPUT_AZOTEQ_IQS5XX silently falls back to 'n'.
#
# CONFIG_ZMK_POINTING comes from the shield's Kconfig.defconfig, but it
# is spelled out here because the HID report descriptor changes when it
# is on: after enabling it (or after switching this config to/from a
# build without a pointer) every host must be UN-PAIRED and PAIRED
# AGAIN, otherwise it keeps the cached descriptor and silently drops
# the mouse reports. That is the single most common "the touchpad
# stopped working" cause on Linux, where the BLE HID cache only clears
# when the device is removed.
CONFIG_I2C=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y
CONFIG_ZMK_POINTING=y

# ~60 reports/s. The REL_X/REL_Y registers accumulate since the previous
# read, so a shorter interval ships smaller, more frequent deltas. 8 ms
# made things WORSE in flash testing (cursor teleported): 125 heavy I2C
# cycles/s over the busy peripheral half (BLE split relay + radio) caused
# read-failure bursts, and each burst tripped the driver's backoff (see
# below) — a 1 s park, then one giant accumulated delta = jump. 16 ms is
# the value the k04-polling branch was tuned for; do not raise the rate
# again before the backoff stall is gone.
CONFIG_INPUT_AZOTEQ_IQS5XX_POLL_INTERVAL_MS=16

# The backoff from patches/0002 exists to keep an ABSENT module from
# hammering the bus at 60 Hz. On this machine the module is always
# present, so a stall buys nothing and the 1 s default is exactly the
# "cursor freezes, then jumps" symptom: transient NACKs (chip busy under
# bus load) escalate into a 1 s park. 48 ms keeps the power-saving idea
# (a dead bus still polls 3x slower than normal) without the visible
# hitch; if a real dropout reappears as "stutter every ~50ms", raise it
# stepwise rather than reverting to 1000.
CONFIG_INPUT_AZOTEQ_IQS5XX_POLL_BACKOFF_MS=48

# Scroll feel: the driver emits one wheel notch per 32px of two-finger
# travel (a divisor compiled into the driver, not a Kconfig). If scrolling
# feels too heavy or too twitchy, that constant is the thing to change, and
# it lives in the k04-polling branch of the IQS5xx fork.
# Smooth scrolling (ZMK_POINTING_SMOOTH_SCROLLING) is left off on purpose:
# it only matters for hosts that negotiate HID resolution multipliers, and
# turning it changes the descriptor again (re-pair required).
