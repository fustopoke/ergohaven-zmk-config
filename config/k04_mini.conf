# K:04 Mini — modeled on ergohaven's k03.conf (sleep + battery reporting).

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=7

# Onboard status LED: a single WS2812-class RGB LED, data line on P0.30,
# driven via SPIM3 and exposed as the ZMK underglow device.
# ergohaven/zmk-smart-rgbled-widget indicates battery level (green/
# yellow/red), BT profile and connection state (blue/yellow/red) with
# colored blinks, on both halves.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SMART_RGBLED_WIDGET=y

# Touchpad module (right half only — the DT node exists on that side):
# Azoteq IQS5xx polled over I2C, the module socket does not route RDY.
# CONFIG_I2C is required for the driver's Kconfig dependencies to resolve;
# without it INPUT_AZOTEQ_IQS5XX silently falls back to 'n'.
CONFIG_I2C=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y
CONFIG_INPUT_AZOTEQ_IQS5XX_POLL_INTERVAL_MS=16
