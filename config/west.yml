manifest:
  remotes:
    - name: ergohaven
      url-base: https://github.com/ergohaven
    - name: fustopoke
      url-base: https://github.com/fustopoke
    - name: arazyan
      url-base: https://github.com/arazyan
    - name: urob
      url-base: https://github.com/urob
  projects:
    # Revisions are pinned to exact commits, not branch names: the two
    # k04 forks below carry patches/ diffs applied on top of fustopoke
    # bases, and an unpinning branch moved under them once already. To
    # update: rebase the matching patch onto the new upstream commit in
    # the fork and move the SHA in the same commit.
    - name: ergohaven-zmk
      remote: ergohaven
      revision: ebba0c8d7f2112a40413b84ff9774195ade05130 # branch: main
      import: config/west.yml
    # Azoteq IQS5xx touchpad driver — fork carrying the polling-mode patch
    # for the K:04 module socket (RDY line is not routed to the MCU).
    # Required by the k04_mini builds. Personal fork of fustopoke's
    # k04-polling branch with patches/0002 applied via `git am`
    # (SHOW_RESET self-heal, sleep-gated polling, I2C failure backoff);
    # base 2af5a3e. Rebase the patch onto upstream and bump this
    # revision together, see patches/README.md.
    - name: zmk-driver-azoteq-iqs5xx
      remote: arazyan
      revision: de6cb7a1652bda3bc33228fc5a2d3f21da79d5bc # branch: k04-polling
    # Colored battery / BT profile / connection blinks on the onboard
    # WS2812 indicator LED (chosen zmk,underglow in the k04_mini shield).
    # patches/0001 now lives directly on this fustopoke branch (base
    # 5fd554d, applied via `git am`): frame dedupe + direct strip writes,
    # sleep gating, right-half color re-push, official 20% low-battery
    # threshold, plus the fresh-battery-sample fix that stops the right
    # half blinking BLACK when its charge cache is still 0. Bump = amend
    # the branch and move this SHA together with the regenerated patch,
    # see patches/README.md.
    - name: zmk-smart-rgbled-widget
      remote: fustopoke
      revision: 08cc150489b02350ba9a8ba7de60b2157122ab2a # branch: k04-led-fixes
    # Unicode input for the sym layer (&uc): lets the symbol layer type
    # code points (Latin punctuation like @ { } ~) regardless of which OS
    # layout is active, WITHOUT touching the layout — so T7 no longer has
    # to switch language to be usable. UC_MODE_LINUX (Ctrl+Shift+U).
    - name: zmk-unicode
      remote: urob
      revision: v0.3
  self:
    path: config
